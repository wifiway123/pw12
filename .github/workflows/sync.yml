name: Sync and Mixed Build Files全量拉取

on:
  schedule:
    - cron: '0 18 * * 3,0'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 提前安装必需的解包依赖
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd xz-utils curl jq

      # 检出上次同步的网页端状态（仅用于生成更新日志比对，绝对不参与实际文件混合）
      - name: Checkout Previous State
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: old_state
        continue-on-error: true

      - name: Sync Packages & Clean Legacy Files
        id: sync
        run: |
          BEIJING_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          echo "REPORT_DATE=$BEIJING_TIME" >> $GITHUB_ENV
          
          # 💡 彻底去掉 22.03 的同步
          VERSIONS=("packages-24.10" "packages-23.05" "packages-21.02")
          DIRS=("passwall_packages" "passwall2" "passwall_luci")
          ARCH="aarch64_cortex-a53"
          
          LOG_FILE="update_log.txt"
          rm -f plugin_list.txt && touch plugin_list.txt
          MAIN_UPDATED=false
          LATEST_VERSION_STR=""
          
          # 💡 100% 强行全量拉取，从物理根源上断绝索引与实体包错配的可能！
          for v in "${VERSIONS[@]}"; do
            for d in "${DIRS[@]}"; do
              LOCAL_DIR="$v/$ARCH/$d"
              mkdir -p "$LOCAL_DIR"
              PAGE_URL="https://sourceforge.net/projects/openwrt-passwall-build/files/releases/$v/$ARCH/$d/"
              REMOTE_FILES=$(curl -sL "$PAGE_URL" | grep -o 'href="[^"]*/download"' | awk -F'/' '{print $(NF-1)}' || true)
              
              for filename in $REMOTE_FILES; do
                [ -z "$filename" ] && continue
                LOCAL_FILE="$LOCAL_DIR/$filename"
                OLD_STATE_FILE="old_state/$LOCAL_DIR/$filename"
                
                # 无脑强行全量下载，坚决不用 -z
                curl -fsL -R -O --output-dir "$LOCAL_DIR" "https://downloads.sourceforge.net/project/openwrt-passwall-build/releases/$v/$ARCH/$d/$filename" --retry 3 || true
                
                if [[ "$filename" == *.ipk ]]; then
                  if [ -f "$LOCAL_FILE" ]; then
                    # 防御性编程：如果下载到了 SourceForge 的 404 报错页，直接干掉
                    if [ $(wc -c < "$LOCAL_FILE") -lt 2048 ]; then
                      rm -f "$LOCAL_FILE"
                    else
                      # 正常文件比对以生成日志
                      NEW_HASH=$(md5sum "$LOCAL_FILE" | cut -d' ' -f1)
                      [ -f "$OLD_STATE_FILE" ] && OLD_HASH=$(md5sum "$OLD_STATE_FILE" | cut -d' ' -f1) || OLD_HASH="none"
                      
                      if [ "$OLD_HASH" != "$NEW_HASH" ]; then
                        PLUGIN_NAME=$(echo "$filename" | cut -d'_' -f1)
                        echo "$PLUGIN_NAME" >> plugin_list.txt
                        
                        if [ "$PLUGIN_NAME" = "luci-app-passwall" ]; then
                          MAIN_UPDATED=true
                          LATEST_VERSION_STR=$(echo "$filename" | sed -E 's/luci-app-passwall_([0-9.]+-[0-9a-zA-Z_.]+)_all\.ipk/\1/')
                        fi
                      fi
                    fi
                  fi
                fi
              done
            done
          done
          
          # =======================================================
          # 🩹 动态修补 21.02：无缝借用 23.05 的强劲核心组件
          # =======================================================
          WORKSPACE=$PWD
          DIR_2102="$WORKSPACE/packages-21.02/$ARCH/passwall_packages"
          DIR_2305="$WORKSPACE/packages-23.05/$ARCH/passwall_packages"
          
          if [ -d "$DIR_2102" ] && [ -d "$DIR_2305" ]; then
            cd "$DIR_2102"
            for borrow_pkg in "xray-core" "sing-box"; do
              PKG_FILE=$(ls "$DIR_2305"/${borrow_pkg}_*.ipk 2>/dev/null | head -n 1)
              if [ -n "$PKG_FILE" ]; then
                FNAME=$(basename "$PKG_FILE")
                if [ ! -f "$FNAME" ]; then
                  cp "$PKG_FILE" .
                  
                  if [ -f "Packages.gz" ]; then
                    gunzip -k Packages.gz || true
                    
                    mkdir -p /tmp/pkg_extract
                    tar -xf "$FNAME" -C /tmp/pkg_extract 2>/dev/null || true
                    
                    if [ -f /tmp/pkg_extract/control.tar.gz ]; then
                      tar -zxO -f /tmp/pkg_extract/control.tar.gz ./control >> Packages
                    elif [ -f /tmp/pkg_extract/control.tar.zst ]; then
                      zstd -d /tmp/pkg_extract/control.tar.zst -c | tar -xO -f - ./control >> Packages
                    elif [ -f /tmp/pkg_extract/control.tar.xz ]; then
                      xz -d /tmp/pkg_extract/control.tar.xz -c | tar -xO -f - ./control >> Packages
                    fi
                    
                    rm -rf /tmp/pkg_extract
                    
                    echo "Filename: $FNAME" >> Packages
                    echo "Size: $(stat -c%s "$FNAME")" >> Packages
                    echo "SHA256sum: $(sha256sum "$FNAME" | awk '{print $1}')" >> Packages
                    echo "" >> Packages
                    rm -f Packages.gz && gzip -k Packages
                  fi
                fi
              fi
            done
            cd "$WORKSPACE"
          fi
          
          # =======================================================
          # 📝 修复版日志重塑逻辑（绝不动用 sed，100%无报错风险）
          # =======================================================
          TMP_LOG="/tmp/update_log.tmp"
          echo "### 📦 软件源更新状态 ($BEIJING_TIME)" > "$TMP_LOG"
          echo "" >> "$TMP_LOG"
          
          if [ "$MAIN_UPDATED" = "true" ] && [ -n "$LATEST_VERSION_STR" ]; then
            echo "> 🚀 **检测到上游发布新版本: \`${LATEST_VERSION_STR}\`**" >> "$TMP_LOG"
            echo "" >> "$TMP_LOG"
            echo "- ✅ Passwall 主程序已全自动同步并滚动升级。" >> "$TMP_LOG"
          else
            CURRENT_FILE=$(find packages-24.10/$ARCH -type f -name "luci-app-passwall_*.ipk" 2>/dev/null | head -n 1 || true)
            if [ -n "$CURRENT_FILE" ]; then
              CUR_VER=$(basename "$CURRENT_FILE" | sed -E 's/luci-app-passwall_([0-9.]+-[0-9a-zA-Z_.]+)_all\.ipk/\1/')
              echo "> ℹ️ **当前组件库稳定维护中 | 核心版本: \`${CUR_VER}\`**" >> "$TMP_LOG"
              echo "" >> "$TMP_LOG"
            fi
            echo "- ℹ️ 今日无主程序升级，全量依赖库已自动完成一致性校验。" >> "$TMP_LOG"
          fi
          mv "$TMP_LOG" "$LOG_FILE"
          echo "MAIN_UPDATED=$MAIN_UPDATED" >> $GITHUB_ENV

      - name: Build .run Installers
        if: env.MAIN_UPDATED == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p run_output
          ARCH="aarch64_cortex-a53"
          
          create_run() {
            local source_ver=$1
            local target_ver=$2
            shift 2
            local pkgs=("$@")
            local tmp_dir="run_tmp_$target_ver/passwall_install_tmp"
            mkdir -p "$tmp_dir"
            for pkg in "${pkgs[@]}"; do
              found=$(find "$source_ver/$ARCH" -type f -name "${pkg}_*.ipk" 2>/dev/null | head -n 1 || true)
              if [ -n "$found" ] && { [ "$pkg" = "sing-box" ] || [ "$pkg" = "xray-core" ]; }; then
                [ $(wc -c < "$found") -lt 1000000 ] && found=""
              fi
              if [ -z "$found" ]; then
                found=$(find packages-*/$ARCH -type f -name "${pkg}_*.ipk" -size +2k 2>/dev/null | head -n 1 || true)
              fi
              if [ -n "$found" ] && [ -f "$found" ]; then
                cp "$found" "$tmp_dir/"
                if [ "$target_ver" = "21.02" ]; then
                  mkdir -p "$tmp_dir/unpack"
                  tar -xf "$tmp_dir/$(basename "$found")" -C "$tmp_dir/unpack/" 2>/dev/null || true
                  cd "$tmp_dir/unpack"
                  for archive in *; do
                    [ -f "$archive" ] && {
                      [[ "$archive" == *.zst ]] && zstd -d "$archive" --rm 2>/dev/null || true
                      [[ "$archive" == *.xz ]] && xz -d "$archive" --rm 2>/dev/null || true
                      gzip "${archive%.*}" 2>/dev/null || true
                    }
                  done
                  tar -czf "../$(basename "$found")" debian-binary control.tar.gz data.tar.gz 2>/dev/null || true
                  cd - >/dev/null
                  rm -rf "$tmp_dir/unpack"
                fi
              fi
            done
            echo "#!/bin/sh" > "$tmp_dir/install.sh"
            echo "opkg update && opkg install *.ipk" >> "$tmp_dir/install.sh"
            cat << 'EOF' > "run_output/install_passwall_${target_ver}.run"
          #!/bin/sh
          ARCHIVE=$(awk '/^__ARCHIVE_BELOW__/ {print NR + 1; exit 0; }' "$0")
          tail -n+$ARCHIVE "$0" | tar -xz -C /tmp
          cd /tmp/passwall_install_tmp && sh install.sh
          rm -rf /tmp/passwall_install_tmp
          exit 0
          __ARCHIVE_BELOW__
          EOF
            tar -czf - -C "run_tmp_$target_ver" passwall_install_tmp >> "run_output/install_passwall_${target_ver}.run"
            chmod +x "run_output/install_passwall_${target_ver}.run"
            rm -rf "run_tmp_$target_ver"
          }
          
          list_2=("luci-compat" "luci-app-passwall" "luci-i18n-passwall-zh-cn" "tcping" "chinadns-ng" "dns2socks" "microsocks" "xray-core" "unzip")
          list_n=("luci-compat" "luci-app-passwall" "luci-i18n-passwall-zh-cn" "tcping" "chinadns-ng" "dns2socks" "microsocks" "xray-core" "sing-box" "unzip")
          
          create_run "packages-21.02" "21.02" "${list_2[@]}"
          create_run "packages-23.05" "23.05" "${list_n[@]}"
          create_run "packages-24.10" "24.10" "${list_n[@]}"

      # 💡 核心功能：全自动生成专属备忘录（移除了已弃用的 22.03）
      - name: Generate Secret Memo
        run: |
          mkdir -p web_root
          cat << 'EOF' > web_root/my.txt
          ==================================================
          🔒 个人专属自定义源配置备忘录 (请勿外传)
          ==================================================

          【🌐 路由器适用：OpenWrt 21.02 分支】
          src/gz custom_pw_packages https://git.dawu.de5.net/gh-pages/packages-21.02/aarch64_cortex-a53/passwall_packages
          src/gz custom_pw_packages2 https://git.dawu.de5.net/gh-pages/packages-21.02/aarch64_cortex-a53/passwall2
          src/gz custom_pw_luci https://git.dawu.de5.net/gh-pages/packages-21.02/aarch64_cortex-a53/passwall_luci

          【🌐 路由器适用：OpenWrt 23.05 分支】
          src/gz custom_pw_packages https://git.dawu.de5.net/gh-pages/packages-23.05/aarch64_cortex-a53/passwall_packages
          src/gz custom_pw_packages2 https://git.dawu.de5.net/gh-pages/packages-23.05/aarch64_cortex-a53/passwall2
          src/gz custom_pw_luci https://git.dawu.de5.net/gh-pages/packages-23.05/aarch64_cortex-a53/passwall_luci

          【🌐 路由器适用：OpenWrt 24.10 分支】
          src/gz custom_pw_packages https://git.dawu.de5.net/gh-pages/packages-24.10/aarch64_cortex-a53/passwall_packages
          src/gz custom_pw_packages2 https://git.dawu.de5.net/gh-pages/packages-24.10/aarch64_cortex-a53/passwall2
          src/gz custom_pw_luci https://git.dawu.de5.net/gh-pages/packages-24.10/aarch64_cortex-a53/passwall_luci

          【⚡ 附：路由器端 opkg 强力缓存清理命令】
          rm -rf /var/opkg-lists/* && opkg update
          ==================================================
          EOF

      - name: Generate Index
        run: |
          mkdir -p web_root
          mv packages-* web_root/ 2>/dev/null || true
          
          generate_index() {
            local dir=$1
            local title=$2
            local index_file="$dir/index.html"
            [ ! -d "$dir" ] && return 0
            echo "<html><head><meta charset='UTF-8'><meta name='robots' content='noindex,nofollow'><title>$title</title></head><body>" > "$index_file"
            echo "<h3>Index of ${dir:-/}</h3><hr>" >> "$index_file"
            [ "$(basename "$dir")" != "web_root" ] && echo "<div><a href='../index.html'>[ .. ]</a></div>" >> "$index_file"
            find "$dir" -maxdepth 1 -type d -not -path "$dir" -not -path '*/.*' | sort | while read -r subdir; do
              local name=$(basename "$subdir")
              echo "<div>DIR: <a href='$name/index.html'>$name/</a></div>" >> "$index_file"
            done
            
            # 💡 核心除错处理：添加 -not -name "my.txt"，使其在生成的网页 HTML 文件列表中彻底隐身
            find "$dir" -maxdepth 1 -type f -not -name "index.html" -not -name "my.txt" -not -path '*/.*' | sort | while read -r file; do
              local name=$(basename "$file")
              echo "<div>FILE: <a href='$name'>$name</a></div>" >> "$index_file"
            done
            echo "<hr>Nodes status: OK / $REPORT_DATE</body></html>" >> "$index_file"
          }
          generate_index "web_root" "Software Feeds Index"
          find web_root -maxdepth 4 -type d -not -path '*/.*' | while read -r d; do
            [ "$d" = "web_root" ] && continue
            generate_index "$d" "$(basename "$d")"
          done

      - name: Release .run files to GitHub Releases
        if: env.MAIN_UPDATED == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest-a53"
          gh release delete "$TAG_NAME" --cleanup-tag -y || true
          gh release create "$TAG_NAME" run_output/*.run --title "Passwall-A53-一键安装离线包" --notes-file update_log.txt

      - name: Deploy Software Feeds to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_root
          publish_branch: gh-pages
          force_orphan: true
